on:
  push:
    branches:
      - main
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
          server: ftp.thenightowl.team
          username: valorhub@thenightowl.team
          password: "E9H@CdsvtnJiA#m$"
          port: 21
          local-dir: ./
          dry-run: ${{ inputs.dry_run == true }}
          # Only files that changed since the last deploy are sent (tracked in
          # .ftp-deploy-sync-state.json on the server); the first run uploads everything.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            .github/**
            .env
            .env.*
            storage/**
            public/storage
            public/storage/**
            public/hot
            tests/**
            Template/**
            .editorconfig
            .npmrc
            .phpunit.result.cache
            phpunit.xml
            package.json
            package-lock.json
            vite.config.js
            README.md
